name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run contract and HTTP integration tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check routes/auth.js
          node --check routes/quotes.js
          node --check tools/migrate.js
      - name: Validate API contract and migrations
        run: |
          node -e "JSON.parse(require('fs').readFileSync('docs/openapi.json', 'utf8'))"
          test -s migrations/001_initial_schema.sql
          test -s migrations/002_sessions_and_job_runs.sql
          test -s migrations/003_query_performance_indexes.sql
