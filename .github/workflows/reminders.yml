name: Send assignment reminders

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminders endpoint
        run: curl --fail --silent --show-error -X POST "${{ vars.BACKEND_URL }}/api/cron/send-reminders?key=${{ secrets.CRON_SECRET }}"
